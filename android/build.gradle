group 'com.repeatlab.precise_metronome'
version '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.repeatlab.precise_metronome'
    compileSdk 34
    // r27+ makes 16 KB page alignment the linker default. Matches the app's NDK
    // so no extra NDK download is required. Fixes 16 KB compat for
    // libprecise_metronome.so and the bundled libc++_shared.so.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 28

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3 -fvisibility=hidden -ffast-math'
                // Force 16 KB ELF alignment even if a future NDK regresses the default.
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // 1.9.3+ ships 16 KB-aligned prebuilt liboboe.so (1.9.0 was 4 KB).
    implementation 'com.google.oboe:oboe:1.9.3'
    implementation 'androidx.core:core-ktx:1.12.0'
}
