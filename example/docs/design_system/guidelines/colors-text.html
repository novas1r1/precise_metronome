<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="align-items:flex-end;gap:24px"><div style="flex:1"><div style="font:600 22px var(--font-display);letter-spacing:var(--tracking-tight);color:var(--text-primary)">Primary 120 BPM</div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">--text-primary</div></div><div style="flex:1"><div style="font:600 22px var(--font-display);letter-spacing:var(--tracking-tight);color:var(--text-secondary)">Secondary label</div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">--text-secondary</div></div><div style="flex:1"><div style="font:600 22px var(--font-display);letter-spacing:var(--tracking-tight);color:var(--text-muted)">Muted caption</div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">--text-muted</div></div><div style="flex:1"><div style="font:600 22px var(--font-display);letter-spacing:var(--tracking-tight);color:var(--accent-hover)">Link</div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">--accent-hover</div></div></div></body></html>
