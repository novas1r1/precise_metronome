<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:170px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="position:relative;height:130px;border-radius:var(--radius-lg);background:radial-gradient(circle at 30% 50%,var(--accent-glow),transparent 55%),var(--navy-900);display:flex;gap:16px;padding:16px;box-sizing:border-box"><div style="flex:1;border-radius:var(--radius-md);background:var(--surface-glass);border:1px solid var(--surface-glass-border);backdrop-filter:var(--blur-glass);box-shadow:var(--shadow-glass);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-secondary)">--surface-glass<br>5%</div><div style="flex:1;border-radius:var(--radius-md);background:var(--surface-glass-strong);border:1px solid var(--surface-glass-border);backdrop-filter:var(--blur-glass);box-shadow:var(--shadow-glass);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-secondary)">--surface-glass-strong<br>9%</div><div style="flex:1;border-radius:var(--radius-md);background:var(--surface-card);border:1px solid var(--surface-glass-border);backdrop-filter:var(--blur-glass);box-shadow:var(--shadow-glass);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-secondary)">--surface-card<br>solid</div></div></body></html>
