<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">4</div></div><div style="text-align:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">5</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">6</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">8</div></div><div style="text-align:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">10</div></div><div style="text-align:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">12</div></div><div style="text-align:center"><div style="width:var(--space-16);height:var(--space-16);background:var(--accent);border-radius:2px;margin:0 auto"></div><div style="font:11px var(--font-mono);color:var(--text-muted);margin-top:8px">16</div></div></div></body></html>
