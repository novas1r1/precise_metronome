<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--surface-glass-strong);border-radius:var(--radius-sm);height:72px"></i><b>--radius-sm</b></div><div class="sw"><i style="background:var(--surface-glass-strong);border-radius:var(--radius-md);height:72px"></i><b>--radius-md</b></div><div class="sw"><i style="background:var(--surface-glass-strong);border-radius:var(--radius-lg);height:72px"></i><b>--radius-lg</b></div><div class="sw"><i style="background:var(--surface-glass-strong);border-radius:var(--radius-xl);height:72px"></i><b>--radius-xl</b></div><div class="sw"><i style="background:var(--surface-glass-strong);border-radius:var(--radius-pill);height:72px"></i><b>--radius-pill</b></div></div></body></html>
