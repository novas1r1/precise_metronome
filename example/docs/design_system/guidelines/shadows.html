<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:190px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="padding:10px;gap:30px"><div style="flex:1;height:110px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-glass);display:flex;align-items:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-muted)">--shadow-glass</div><div style="flex:1;height:110px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-float);display:flex;align-items:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-muted)">--shadow-float</div><div style="flex:1;height:110px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-accent-glow);display:flex;align-items:flex-end;padding:12px;font:11px var(--font-mono);color:var(--text-muted)">--shadow-accent-glow</div></div></body></html>
