<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Beat states and feedback" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--positive)"></i><b>--positive</b><span>mint · target reached</span></div><div class="sw"><i style="background:var(--warning)"></i><b>--warning</b><span>sun · accented beat</span></div><div class="sw"><i style="background:var(--info)"></i><b>--info</b><span>sky · ramp down</span></div><div class="sw"><i style="background:var(--danger)"></i><b>--danger</b><span>coral · error</span></div></div></body></html>
