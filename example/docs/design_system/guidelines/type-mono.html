<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:32px;align-items:center;font-family:var(--font-mono)"><div style="font-size:14px;color:var(--text-secondary)">bar <b style="color:var(--text-primary)">3</b> / 4</div><div style="font-size:14px;color:var(--accent)">+5 → 125</div><div style="font-size:14px;color:var(--info)">−5 → 115</div><div style="font-size:14px;color:var(--text-muted)">4/4 · ♪ eighths</div><div style="font-size:14px;padding:4px 10px;border-radius:var(--radius-pill);background:var(--positive-soft);color:var(--positive)">target 140</div></div></body></html>
