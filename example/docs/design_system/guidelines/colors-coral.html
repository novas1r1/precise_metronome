<!-- @dsCard group="Colors" viewport="700x150" name="Coral accent" subtitle="Primary action, beat pulse, glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:150px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--coral-300)"></i><b>--coral-300</b><span>soft</span></div><div class="sw"><i style="background:var(--coral-400)"></i><b>--coral-400</b><span>hover</span></div><div class="sw"><i style="background:var(--coral-500)"></i><b>--coral-500</b><span>accent</span></div><div class="sw"><i style="background:var(--coral-600)"></i><b>--coral-600</b><span>press</span></div><div class="sw"><i style="background:var(--coral-700)"></i><b>--coral-700</b><span>deep</span></div></div></body></html>
