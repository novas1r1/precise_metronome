<!-- @dsCard group="Type" viewport="700x210" name="Headings" subtitle="Archivo, tight tracking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;box-sizing:border-box;height:210px;overflow:hidden}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.sw b{font:500 11px var(--font-mono);color:var(--text-primary)}.sw span{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px"><div style="font:700 var(--text-display)/1 var(--font-display);letter-spacing:var(--tracking-display)">Dynamic mode</div><div style="font:700 var(--text-h1)/1.1 var(--font-display);letter-spacing:var(--tracking-tight)">Every 4 bars, +5 BPM</div><div style="font:600 var(--text-h2)/1.15 var(--font-display);letter-spacing:var(--tracking-tight)">Ramp back down</div><div style="font:600 var(--text-h3)/1.2 var(--font-display)">Time signature</div></div></body></html>
